name: Update Feeds

on:
  schedule:
    # GitHub usually starts scheduled runs a few hours late; outputs carry their own timestamp.
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Publish even if validation fails
        type: boolean
        default: false
  push:
    branches: [master]
    paths: ['threatkill/**', 'tests/**', 'aggregator.py']
  pull_request:
    paths: ['threatkill/**', 'tests/**', 'aggregator.py', 'feeds.json']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python -m unittest discover -s tests -t . -v

  update:
    needs: test
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Fetch previous release state
        # Used to reuse data for feeds that fail today and to detect regressions.
        run: |
          mkdir -p prev
          gh release download --dir prev --pattern blocklist.bin || echo "No previous blocklist.bin"
          gh release download --dir prev --pattern manifest.json || echo "No previous manifest.json"

      - name: Download, validate and build
        run: |
          FORCE=""
          if [ "${{ inputs.force }}" = "true" ]; then FORCE="--force"; fi
          python aggregator.py --previous prev --out data $FORCE

      - name: Check for changes
        id: changes
        run: |
          NEW=$(jq -r .content_hash data/manifest.json)
          OLD=$(jq -r '.content_hash // empty' prev/manifest.json 2>/dev/null || true)
          if [ "$NEW" = "$OLD" ]; then
            echo "Data unchanged since the last release ($NEW); skipping."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create release
        if: steps.changes.outputs.changed == 'true'
        run: |
          TAG="v$(date -u +%Y%m%d-%H%M%S)"
          python -m threatkill.notes data/manifest.json "$GITHUB_REPOSITORY" > release-notes.md
          gh release create "$TAG" data/* \
            --title "Threatkill Update — $(date -u +'%Y-%m-%d %H:%M UTC')" \
            --notes-file release-notes.md

      - name: Clean up old releases
        if: steps.changes.outputs.changed == 'true'
        run: |
          KEEP=3
          mapfile -t TAGS < <(gh release list --limit 100 --json tagName,createdAt \
            | jq -r 'sort_by(.createdAt) | reverse | .[].tagName')
          for TAG in "${TAGS[@]:$KEEP}"; do
            echo "Deleting old release $TAG"
            gh release delete "$TAG" --yes --cleanup-tag || echo "Could not delete $TAG"
          done
